[project]
name = "dupont-qspr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Huffington", email = "e.d.huffington@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastexcel>=0.20.2",
    "matplotlib>=3.11.1",
    "mlflow>=3.15",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas<3",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rdkit>=2026.3.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
dupont-qspr = "dupont_qspr:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mapie>=1.5.0",
    "pydeps>=3.0.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The two markers must run in SEPARATE processes. xgboost and transformers each
# link their own OpenMP runtime, and loading a transformers model in a process
# that has already fitted an XGBoost model hangs or segfaults on macOS/arm64.
# The tracks are separate processes in production anyway, so this costs nothing.
markers = [
    "torch: needs a transformers model; must not share a process with xgboost",
]
# Marker deselection does not prevent module import, and importing xgboost is
# enough to poison the process. Isolation is therefore by collection path — see
# tests/torch_runtime/README.md:
#   uv run pytest --ignore=tests/torch_runtime
#   uv run pytest tests/torch_runtime
